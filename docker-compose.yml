version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: ./pricescout-frontend
      dockerfile: Dockerfile
      args:
        # 设置构建参数，用于配置API地址
        - API_URL=http://121.36.199.66/api
    restart: always
    networks:
      - pricescout_network
    # 不需要暴露端口，由主 Nginx 代理
    volumes:
      - pricehis_data:/usr/share/nginx/pricehis:ro # 只读方式挂载价格历史图片
    # 移除对 nginx 的依赖
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务
  backend:
    build:
      context: ./pricescout-backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - MYSQL_DATABASE=bs_commodity
      - MYSQL_USER=root
      - MYSQL_PASSWORD=ww71304002ww
      - MYSQL_HOST=db
    volumes:
      - type: volume
        source: pricehis_data
        target: /usr/share/nginx/pricehis
    networks:
      - pricescout_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s # 给予足够的启动时间

  # 数据库服务
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_DATABASE=bs_commodity
      - MYSQL_ROOT_PASSWORD=ww71304002ww
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pricescout_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 主 Nginx 服务
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    restart: always
    ports:
      - "80:80" # 只在主 Nginx 上暴露端口
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - pricehis_data:/usr/share/nginx/pricehis:ro
    # 修改依赖关系，确保前后端服务都已启动
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pricescout_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pricescout_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  pricehis_data:
    driver: local
