    # 动态代理图片请求
    location ~* ^/image_proxy/(.*) {
        set $target_url $1;
        resolver 8.8.8.8;  # 指定 DNS 解析器
        proxy_pass https://$target_url;

        # 将域名部分从路径中提取并设置 Host
        set $host_part $target_url;
        if ($host_part ~* ^([^/]+)(/.*)$) {
            set $host_part $1;
        }
        proxy_set_header Host $host_part;

        # 设置其他代理头
        proxy_set_header Referer "https://www.bijia.com/";
        proxy_set_header Accept "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8";
        proxy_set_header Accept-Language "zh-CN,zh;q=0.9";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Safari/537.36 QuarkPC/1.9.5.161";

        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;

        proxy_hide_header X-Forwarded-For;
        proxy_hide_header Via;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Via "";
    }
