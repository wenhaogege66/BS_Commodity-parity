version: '3.8'

services:
  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - MYSQL_DATABASE=bs_commodity
      - MYSQL_USER=root
      - MYSQL_PASSWORD=ww71304002ww
      - MYSQL_HOST=db
    volumes:
      - pricehis_data:/app/pricehis
    networks:
      - pricescout_network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_DATABASE=bs_commodity
      - MYSQL_ROOT_PASSWORD=ww71304002ww
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - pricescout_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    build: 
      context: .
      dockerfile: nginx.Dockerfile
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - pricehis_data:/usr/share/nginx/pricehis:ro
    depends_on:
      - web
    networks:
      - pricescout_network

networks:
  pricescout_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  pricehis_data:
    driver: local