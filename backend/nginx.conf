server {
    listen 80;
    server_name 121.36.199.66;
    
    # 添加默认首页配置
    root /usr/share/nginx/html;  # nginx 默认静态文件目录
    index index.html index.htm;

    # 默认路由配置（处理静态页面请求）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin * always;
    }
    
    # 静态文件服务
    location /pricehis/ {
        alias /usr/share/nginx/pricehis/;
        autoindex on;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
        
        # 添加调试日志
        access_log /var/log/nginx/pricehis_access.log;
        error_log /var/log/nginx/pricehis_error.log debug;
        
        types {
            image/png png;
            image/jpeg jpg jpeg;
        }
    }

    # 后端 API 代理（处理所有 API 请求）
    location /api/ {
        proxy_pass http://web:8000/;  # 确保以斜杠结尾
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # CORS 配置
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
        
        # 增加超时时间
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        
        # 处理 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # 保留原有的比价网代理配置
    location /search/get_keywords {
        proxy_pass https://www.bijia.com/search/get_keywords;
        proxy_set_header Host www.bijia.com;
        proxy_set_header Referer https://www.bijia.com/view/;
        proxy_set_header Origin https://www.bijia.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Safari/537.36 QuarkPC/1.9.5.161";
        proxy_set_header Accept "application/json, text/plain, */*";
        proxy_set_header Accept-Language "zh-CN,zh;q=0.9";
        proxy_set_header Connection "keep-alive";
        proxy_set_header Cookie "device_id=7048174711728213091302965dae986b7a90f72352fbdcf2051ae7c60; sensorsdata2015jssdkcross=%7B%22distinct_id%22%3A%221926186f7e6ea4-0d9a680bfd2e2-303b353f-2073600-1926186f7e71358%22%2C%22first_id%22%3A%22%22%2C%22props%22%3A%7B%22%24latest_traffic_source_type%22%3A%22%E7%9B%B4%E6%8E%A5%E6%B5%81%E9%87%8F%22%2C%22%24latest_search_keyword%22%3A%22%E6%9C%AA%E5%8F%96%E5%88%B0%E5%80%BC_%E7%9B%B4%E6%8E%A5%E6%89%93%E5%BC%80%22%2C%22%24latest_referrer%22%3A%22%22%2C%22%24latest_landing_page%22%3A%22https%3A%2F%2Fwww.bijia.com%2Fview%22%7D%2C%22%24device_id%22%3A%221926186f7e6ea4-0d9a680bfd2e2-303b353f-2073600-1926186f7e71358%22%7D";
        
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization';
        add_header Access-Control-Allow-Credentials 'true';
        add_header Access-Control-Max-Age 86400;

        proxy_hide_header X-Forwarded-For;
        proxy_hide_header Via;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Via "";
    }

